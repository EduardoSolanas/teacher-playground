name: Billing staging evidence

# Named manual evidence run only (workflow_dispatch): never on push. The
# ->/push/CI jobs are exactly the local layers. The staging row
# (IMPLEMENTATION_SPEC.md §7.6, §13) proves the real test-mode round trip that
# no local suite can claim (real Checkout -> webhook -> fetch -> apply).
#
# A staging environment does not exist yet (CLOUDFLARE_ACCESS_STAGING.md:114-126),
# so the §14 "staging" clauses stay APPROVE-AS-BLOCKED until an owner provisions
# one and this run is recorded. Every input is required:false with no default,
# so an unprepared dispatch fails closed — the runner exits non-zero with the
# blocked message instead of producing a false green.
on:
  workflow_dispatch:
    inputs:
      base-url:
        description: >-
          Full staging base URL of the teacher host
          (E2E_STAGING_BASE_URL).
        required: false
        type: string
      access-issuer:
        description: >-
          Staging Cloudflare Access issuer used to mint identities
          (E2E_STAGING_ACCESS_ISSUER).
        required: false
        type: string
      stripe-api-base:
        description: >-
          Stripe API base in test mode
          (STRIPE_API_BASE).
        required: false
        type: string

permissions:
  contents: read

jobs:
  staging:
    name: Real test-mode billing round trip
    runs-on: ubuntu-24.04
    environment: staging
    # The local E2E job (ci.yml) runs in ~12 minutes; the staging run drives
    # hosted Checkout, the Customer Portal, disputes, and Test Clocks on top.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22 is LTS and >= the 20 floor the staging runner wants; matches ci.yml.
          node-version: 22.23.2
          cache: npm

      # Lifecycle scripts are disabled so a compromised transitive package cannot
      # run install/postinstall. Playwright browsers are installed explicitly
      # below; the staging runner needs a real Chromium for the real Checkout and
      # Portal pages, exactly like the local e2e job.
      - name: Install dependencies
        run: npm ci --ignore-scripts --loglevel=error

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Validate Stripe API base input (SEC-A17)
        if: ${{ inputs.stripe-api-base != '' }}
        env:
          STRIPE_API_BASE_INPUT: ${{ inputs.stripe-api-base }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          node -e '
            const raw = process.env.STRIPE_API_BASE_INPUT ?? "";
            const key = process.env.STRIPE_SECRET_KEY ?? "";
            let url;
            try { url = new URL(raw); } catch { url = null; }
            const invalid = !url
              || url.protocol !== "https:"
              || url.username !== ""
              || url.password !== "";
            if (invalid) {
              console.error("::error::STRIPE_API_BASE must be an absolute https URL");
              process.exit(1);
            }
            if (url.host === "api.stripe.com") process.exit(0);
            if (url.hostname.includes("api.stripe.com") || !key.startsWith("sk_test_")) {
              console.error("::error::STRIPE_API_BASE may only leave api.stripe.com for a sk_test_ key");
              process.exit(1);
            }
          '

      # The worker and e2e assets must exist in out/ before the runner starts,
      # and the build changes with every billing phase, so it is never cached.
      - name: Build
        run: npm run build

      - name: Run billing staging evidence
        run: npm run test:billing:staging
        env:
          # URLs come from the dispatch inputs...
          E2E_STAGING_BASE_URL: ${{ inputs.base-url }}
          E2E_STAGING_ACCESS_ISSUER: ${{ inputs.access-issuer }}
          STRIPE_API_BASE: ${{ inputs.stripe-api-base }}
          # ... credentials come from repository secrets. Nothing is printed or
          # cached; the runner only tests that the variables are present.
          E2E_STAGING_ACCESS_TOKEN: ${{ secrets.E2E_STAGING_ACCESS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}