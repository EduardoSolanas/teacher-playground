name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  checks:
    name: Lint, unit tests, and build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      # Lifecycle scripts are disabled so a compromised transitive package cannot
      # run install/postinstall. Allowlist: better-sqlite3 (native addon required
      # by unit tests). Rebuild that package explicitly after the ignored install.
      - name: Install dependencies
        run: npm ci --ignore-scripts --loglevel=error

      - name: Rebuild allowlisted native addons
        run: npm rebuild better-sqlite3

      - name: Scan tracked files for secrets and PII
        run: npm run security:scan

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Worker ASSETS bind to ./out. The nonce and marketing HTML tests 404
      # unless the Next export exists before workerd starts.
      - name: Build
        run: npm run build

      - name: Worker Durable Object tests
        run: npm run test:workers

  e2e:
    name: E2E tests
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_WHITEBOARD_INCREMENTS: '1'
      NEXT_PUBLIC_WHITEBOARD_INCREMENT_COMPARE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      # Lifecycle scripts are disabled so a compromised transitive package cannot
      # run install/postinstall. Allowlist: Playwright browsers are installed in
      # the explicit step below, not via package postinstall. better-sqlite3 is
      # not required by this job.
      - name: Install dependencies
        run: npm ci --ignore-scripts --loglevel=error

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  sast:
    name: Static application security testing
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep scan --config auto --error --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.spec.ts' --exclude-rule='javascript.express.security.x-frame-options-misconfiguration.x-frame-options-misconfiguration'

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      # Lifecycle scripts are disabled so a compromised transitive package cannot
      # run install/postinstall. This job only audits the lockfile, so no native
      # addon allowlist rebuild is required.
      - name: Install dependencies
        run: npm ci --ignore-scripts --loglevel=error

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  production-deps-audit:
    name: Production-only dependency audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev --ignore-scripts --loglevel=error

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
