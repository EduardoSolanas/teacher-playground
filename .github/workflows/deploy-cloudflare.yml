name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker and static assets
    runs-on: ubuntu-24.04
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm

      # Lifecycle scripts are disabled so a compromised transitive package cannot
      # run install/postinstall. Allowlist: better-sqlite3 (native addon required
      # by unit and worker tests). Rebuild that package explicitly after the
      # ignored install.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild allowlisted native addons
        run: npm rebuild better-sqlite3

      - name: Scan tracked files for secrets and PII
        run: npm run security:scan

      - name: Static application security testing
        run: pip install semgrep && semgrep scan --config auto --error --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.spec.ts' --exclude-rule='javascript.express.security.x-frame-options-misconfiguration.x-frame-options-misconfiguration'

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Worker tests (real workerd)
        run: npm run test:workers

      # TEMP: e2e skipped until Phase 2 client changes are pushed
      # - name: Install Playwright browser
      #   run: npx playwright install --with-deps chromium

      # - name: End-to-end tests
      #   continue-on-error: true
      #   run: npm run test:e2e -- --skip-build -- --skip-build

      # - name: Upload e2e artifacts on failure
      #   if: failure()
      #   uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      #   with:
      #     name: e2e-results
      #     path: |
      #       test-results/
      #       playwright-report/
      #     retention-days: 7

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
