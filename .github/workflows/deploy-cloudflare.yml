name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker and static assets
    runs-on: ubuntu-24.04
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      # Lifecycle scripts are disabled so a compromised transitive package cannot
      # run install/postinstall. Allowlist: better-sqlite3 (native addon required
      # by unit and worker tests). Rebuild that package explicitly after the
      # ignored install.
      - name: Install dependencies
        run: npm ci --ignore-scripts --loglevel=error

      - name: Rebuild allowlisted native addons
        run: npm rebuild better-sqlite3

      - name: Scan tracked files for secrets and PII
        run: npm run security:scan

      - name: Static application security testing
        run: pip install semgrep && semgrep scan --config auto --error --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.spec.ts' --exclude-rule='javascript.express.security.x-frame-options-misconfiguration.x-frame-options-misconfiguration'

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Worker tests (real workerd)
        run: npm run test:workers

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

