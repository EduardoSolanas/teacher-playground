name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: false
        type: choice
        default: full
        options:
          - full
          - cdn
          - realtime

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.target == 'full' || inputs.target == 'cdn'
    name: Deploy Worker and static assets
    runs-on: ubuntu-24.04
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm

      # Lifecycle scripts are disabled so a compromised transitive package cannot
      # run install/postinstall. Allowlist: better-sqlite3 (native addon required
      # by unit and worker tests). Rebuild that package explicitly after the
      # ignored install.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild allowlisted native addons
        run: npm rebuild better-sqlite3

      - name: Scan tracked files for secrets and PII
        run: npm run security:scan

      - name: Static application security testing
        run: pip install semgrep && semgrep scan --config auto --error --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.spec.ts' --exclude-rule='javascript.express.security.x-frame-options-misconfiguration.x-frame-options-misconfiguration'

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Worker tests (real workerd)
        run: npm run test:workers

      - name: Reconcile Excalidraw R2 CDN
        run: node scripts/excalidraw-cdn.mjs reconcile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload immutable Excalidraw release assets
        run: node scripts/excalidraw-cdn.mjs upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify public Excalidraw CDN
        run: node scripts/excalidraw-cdn.mjs verify

      # TEMP: e2e skipped until Phase 2 client changes are pushed
      # - name: Install Playwright browser
      #   run: npx playwright install --with-deps chromium

      # - name: End-to-end tests
      #   continue-on-error: true
      #   run: npm run test:e2e -- --skip-build -- --skip-build

      # - name: Upload e2e artifacts on failure
      #   if: failure()
      #   uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      #   with:
      #     name: e2e-results
      #     path: |
      #       test-results/
      #       playwright-report/
      #     retention-days: 7

      - name: Deploy with Wrangler
        if: github.event_name == 'push' || inputs.target == 'full'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  provision-realtime:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'realtime'
    name: Provision voice control plane
    runs-on: ubuntu-24.04
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild allowlisted native addons
        run: npm rebuild better-sqlite3

      - name: Scan tracked files for secrets and PII
        run: npm run security:scan

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Worker tests (real workerd)
        run: npm run test:workers

      # This is the first live API call. It is intentionally after every
      # repository gate and only uses the existing playground prod credentials.
      - name: Ensure Cloudflare Realtime SFU app
        id: realtime
        run: node scripts/cloudflare-realtime.mjs ensure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Store Realtime app UID as a Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APP_ID: ${{ steps.realtime.outputs.appId }}
        run: printf '%s' "$APP_ID" | npx wrangler secret put CLOUDFLARE_REALTIME_APP_ID --config wrangler.toml

      - name: Store one-time Realtime app secret as a Worker secret
        if: steps.realtime.outputs.created == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APP_SECRET: ${{ steps.realtime.outputs.appSecret }}
        run: printf '%s' "$APP_SECRET" | npx wrangler secret put CLOUDFLARE_REALTIME_APP_SECRET --config wrangler.toml

      - name: Verify Realtime Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SECRET_LIST="$(npx wrangler secret list --config wrangler.toml --format json)"
          SECRET_LIST="$SECRET_LIST" node --input-type=module -e '
            const parsed = JSON.parse(process.env.SECRET_LIST);
            const entries = Array.isArray(parsed) ? parsed : (parsed.secrets ?? []);
            const names = new Set(entries.map((entry) => typeof entry === "string" ? entry : entry.name));
            const required = ["CLOUDFLARE_REALTIME_APP_ID", "CLOUDFLARE_REALTIME_APP_SECRET"];
            const missing = required.filter((name) => !names.has(name));
            if (missing.length > 0) throw new Error(`Missing required Realtime Worker secrets: ${missing.join(", ")}`);
            console.log("Verified required Realtime Worker secrets.");
          '
