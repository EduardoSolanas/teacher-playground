name: Provision Cloudflare Realtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provision-cloudflare-realtime
  cancel-in-progress: false

jobs:
  provision:
    name: Provision voice control plane
    runs-on: ubuntu-24.04
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild allowlisted native addons
        run: npm rebuild better-sqlite3

      - name: Scan tracked files for secrets and PII
        run: npm run security:scan

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Worker tests (real workerd)
        run: npm run test:workers

      # This is the first live API call. It is intentionally after every
      # repository gate and only uses the existing playground prod credentials.
      - name: Ensure Cloudflare Realtime SFU app
        id: realtime
        run: node scripts/cloudflare-realtime.mjs ensure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # Reapply the non-secret UID on every run. The app secret is intentionally
      # written only when the API created the app and returned it once.
      - name: Store Realtime app UID as a Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APP_ID: ${{ steps.realtime.outputs.appId }}
        run: printf '%s' "$APP_ID" | npx wrangler secret put CLOUDFLARE_REALTIME_APP_ID --config wrangler.toml

      - name: Store one-time Realtime app secret as a Worker secret
        if: steps.realtime.outputs.created == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APP_SECRET: ${{ steps.realtime.outputs.appSecret }}
        run: printf '%s' "$APP_SECRET" | npx wrangler secret put CLOUDFLARE_REALTIME_APP_SECRET --config wrangler.toml

      - name: Verify Realtime Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SECRET_LIST="$(npx wrangler secret list --config wrangler.toml --format json)"
          SECRET_LIST="$SECRET_LIST" node --input-type=module -e '
            const parsed = JSON.parse(process.env.SECRET_LIST);
            const entries = Array.isArray(parsed) ? parsed : (parsed.secrets ?? []);
            const names = new Set(entries.map((entry) => typeof entry === "string" ? entry : entry.name));
            const required = ["CLOUDFLARE_REALTIME_APP_ID", "CLOUDFLARE_REALTIME_APP_SECRET"];
            const missing = required.filter((name) => !names.has(name));
            if (missing.length > 0) throw new Error(`Missing required Realtime Worker secrets: ${missing.join(", ")}`);
            console.log("Verified required Realtime Worker secrets.");
          '
