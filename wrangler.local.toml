# Dedicated local cryptographic issuer environment. This file is never used by
# the production deployment workflow; local-access-issuer.mjs generates keys at
# process start and exposes only its JWKS/token test harness.
name = "teacher-playground-local"
main = "src/worker.ts"
compatibility_date = "2024-12-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
ENVIRONMENT = "local-test"
ACCESS_ISSUER = "http://127.0.0.1:8790"
ACCESS_AUDIENCE = "teacher-playground-local"
ACCESS_JWKS_URL = "http://127.0.0.1:8790/jwks"
# Split-hostname guest join (Task 8). Worker tests override these via miniflare
# bindings. If either is unset, the Worker treats every request as teacher-host.
TEACHER_HOSTNAME = "example.com"
GUEST_HOSTNAME = "join.example.com"
# LiveKit (optional for local A/V smoke). Prefer secrets via `.dev.vars`:
# LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET

[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "IDENTITY"
class_name = "IdentityDO"

# Board images. Miniflare creates this locally on first use, so a local run
# needs no bucket in Cloudflare -- but without the binding declared here the
# upload route would find env.BOARD_FILES undefined and fail only locally.
[[r2_buckets]]
bucket_name = "teacher-playground-board-files-local"
binding = "BOARD_FILES"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["IdentityDO"]
