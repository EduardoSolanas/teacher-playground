name = "teacher-playground"
main = "src/worker.ts"
compatibility_date = "2024-12-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = true  # TODO: set false once a custom domain is configured
preview_urls = false

[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "IDENTITY"
class_name = "IdentityDO"

# new_sqlite_classes (not new_classes) gives the Durable Object a
# SQLite-backed storage backend, which is what DODatabase requires.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["IdentityDO"]

# LiveKit A/V (optional). Prefer `wrangler secret put LIVEKIT_*` in production.
# When unset, POST /api/av/token returns 503 and the UI degrades gracefully.
# [vars]
# LIVEKIT_URL = "wss://your-project.livekit.cloud"
